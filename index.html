<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#F5A623" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Pearce &amp; Sons" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/icon-192.png" sizes="192x192" />
    <title>Pearce &amp; Sons — Staff Transport</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Capture beforeinstallprompt BEFORE the app bundle loads. Chrome
      // fires it once, early, and does not re-fire — if the React listener
      // isn't attached yet (lazy chunks still loading) the event is lost
      // and the in-app "Install App" button never appears. Stash it on
      // window here; AppInner reads window.__deferredInstallPrompt on mount.
      window.__deferredInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        window.__deferredInstallPrompt = e;
        window.dispatchEvent(new Event('transitos:installpromptready'));
      });
      window.addEventListener('appinstalled', function () {
        window.__deferredInstallPrompt = null;
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Register the offline/push service worker after load so it never
      // competes with first render. The outcome is stashed on window so
      // the admin System Health panel can report the ACTUAL failure
      // reason (MIME type, 404, policy block, importScripts throw, ...)
      // instead of a bare "not registered" — the old silent
      // .catch(() => {}) threw away the one useful diagnostic.
      window.__swRegistration = null;
      window.__swRegistrationError = null;
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/sw.js').then(function (reg) {
            window.__swRegistration = reg;
          }).catch(function (err) {
            window.__swRegistrationError = (err && err.message) || String(err);
            console.warn('[PWA] service worker registration failed:', err);
          });
        });
      } else {
        window.__swRegistrationError = 'serviceWorker not supported in this browser/context';
      }
    </script>
  </body>
</html>

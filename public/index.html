<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>TransitOS — Pearce and Sons</title>

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#f5a623" />
    <meta name="background-color" content="#0a0a0f" />

    <!-- iOS: Safari ignores manifest.json icons/display mode entirely and
         needs these specific tags to install as a standalone app with the
         right icon and status bar styling. -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TransitOS" />

    <!-- Android/Chrome address bar tint when the site is open in-browser -->
    <meta name="mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Registered after page load so it never competes with the initial
      // render for bandwidth/CPU on a slow connection.
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js").catch((err) => {
            console.warn("[PWA] service worker registration failed:", err);
          });
        });
      }
    </script>
  </body>
</html>
